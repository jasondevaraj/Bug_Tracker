<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Intelligent Software Defect Tracking System with Resolution Assistance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light-custom">

    <div class="auth-wrapper">
        <div class="card-custom auth-card">
            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none text-primary-custom d-inline-flex align-items-center gap-2 mb-3">
                    <i class="bi bi-bug-fill fs-3"></i>
                    <span class="fs-4 fw-bold font-heading">Intelligent Defect Tracking</span>
                </a>
                <h3 class="fw-bold">Welcome Back</h3>
                <p class="text-muted">Enter your credentials to access your account.</p>
            </div>

            <form action="dashboard.html" method="GET">
                <div class="mb-3">
                    <label for="email" class="form-label fw-medium text-main">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@company.com" required>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label fw-medium text-main mb-0">Password</label>
                        <a href="#" class="text-accent-custom small text-decoration-none">Forgot Password?</a>
                    </div>
                    <input type="password" class="form-control mt-2" id="password" placeholder="••••••••" required>
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label text-muted small" for="rememberMe">Remember me</label>
                </div>
                <button type="submit" class="btn btn-primary-custom w-100 py-2">Login</button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="text-muted mb-0">Don't have an account? <a href="signup.html" class="text-primary-custom fw-medium text-decoration-none">Sign Up</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
